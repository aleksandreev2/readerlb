name: Release signing smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          READERLB_KEYSTORE_B64: ${{ secrets.READERLB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$READERLB_KEYSTORE_B64"
          printf '%s' "$READERLB_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build release APK
        env:
          READERLB_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
          READERLB_KEY_PASSWORD: ${{ secrets.READERLB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify release signing identity
        env:
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -n "$APKSIGNER"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          APK_SHA="$(
            printf '%s\n' "$CERT_OUTPUT" |
            sed -n 's/.*SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':'
          )"

          KEY_SHA="$(
            keytool -list -v \
              -keystore release.keystore \
              -storepass "$READERLB_KEYSTORE_PASSWORD" \
              -alias "$READERLB_KEY_ALIAS" |
            awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}'
          )"

          test -n "$APK_SHA"
          test -n "$KEY_SHA"
          test "$APK_SHA" = "$KEY_SHA"

          echo "Release signing smoke test passed."

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

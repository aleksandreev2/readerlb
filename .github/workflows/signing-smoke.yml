name: Release signing smoke test

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/signing-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          READERLB_KEYSTORE_B64: ${{ secrets.READERLB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$READERLB_KEYSTORE_B64"
          printf '%s' "$READERLB_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build release APK
        env:
          READERLB_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
          READERLB_KEY_PASSWORD: ${{ secrets.READERLB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify release signing identity
        env:
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -n "$APKSIGNER"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          APK_SHA="$(
            printf '%s\n' "$CERT_OUTPUT" |
            sed -n 's/.*SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':'
          )"

          KEY_SHA="$(
            keytool -list -v \
              -keystore release.keystore \
              -storepass "$READERLB_KEYSTORE_PASSWORD" \
              -alias "$READERLB_KEY_ALIAS" |
            awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}'
          )"

          test -n "$APK_SHA"
          test -n "$KEY_SHA"
          test "$APK_SHA" = "$KEY_SHA"

          echo "Release signing smoke test passed."

      - name: Prepare release candidate artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            dist/ReaderLB-release-candidate.apk
          (
            cd dist
            sha256sum ReaderLB-release-candidate.apk \
              > ReaderLB-release-candidate.apk.sha256
          )

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ReaderLB-release-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/ReaderLB-release-candidate.apk
            dist/ReaderLB-release-candidate.apk.sha256

      - name: Build previous-version release APK
        env:
          READERLB_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
          READERLB_KEY_PASSWORD: ${{ secrets.READERLB_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          CURRENT_VERSION_CODE="$(
            sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p'               app/build.gradle.kts |
            head -n 1
          )"
          test -n "$CURRENT_VERSION_CODE"
          test "$CURRENT_VERSION_CODE" -gt 1
          BASELINE_VERSION_CODE="$((CURRENT_VERSION_CODE - 1))"

          python - "$BASELINE_VERSION_CODE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          baseline = int(sys.argv[1])
          text, count_code = re.subn(
              r'versionCode = \d+',
              f'versionCode = {baseline}',
              text,
              count=1,
          )
          text, count_name = re.subn(
              r'versionName = "[^"]+"',
              'versionName = "0.0.0"',
              text,
              count=1,
          )
          if count_code != 1 or count_name != 1:
              raise SystemExit("Unable to prepare baseline version")
          path.write_text(text, encoding="utf-8")
          PY

          ./gradlew :app:assembleRelease --rerun-tasks --stacktrace
          cp app/build/outputs/apk/release/app-release.apk             dist/ReaderLB-upgrade-baseline.apk

          git checkout -- app/build.gradle.kts

          echo "READERLB_SMOKE_BASELINE_CODE=$BASELINE_VERSION_CODE"             >> "$GITHUB_ENV"
          echo "READERLB_SMOKE_CURRENT_CODE=$CURRENT_VERSION_CODE"             >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run release-signed upgrade smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu

            adb install dist/ReaderLB-upgrade-baseline.apk

            BASELINE_CODE="$(
              adb shell dumpsys package com.readerlb.app |
              tr -d '\r' |
              sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' |
              head -n 1
            )"
            UID_BEFORE="$(
              adb shell dumpsys package com.readerlb.app |
              tr -d '\r' |
              sed -n 's/.*userId=\([0-9][0-9]*\).*/\1/p' |
              head -n 1
            )"

            test "$BASELINE_CODE" = "$READERLB_SMOKE_BASELINE_CODE"
            test -n "$UID_BEFORE"

            adb shell am start -W               -n com.readerlb.app/.MainActivity >/dev/null

            adb install -r dist/ReaderLB-release-candidate.apk

            CURRENT_CODE="$(
              adb shell dumpsys package com.readerlb.app |
              tr -d '\r' |
              sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' |
              head -n 1
            )"
            UID_AFTER="$(
              adb shell dumpsys package com.readerlb.app |
              tr -d '\r' |
              sed -n 's/.*userId=\([0-9][0-9]*\).*/\1/p' |
              head -n 1
            )"

            test "$CURRENT_CODE" = "$READERLB_SMOKE_CURRENT_CODE"
            test "$UID_AFTER" = "$UID_BEFORE"

            adb shell am start -W               -n com.readerlb.app/.MainActivity >/dev/null

            echo "Release-signed in-place upgrade smoke passed."

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

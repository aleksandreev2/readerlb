name: Android runtime tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 29
          - 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ReaderLB Runtime Tests,O=ReaderLB,C=AM"
          fi
          echo "READERLB_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Preinstall Android emulator with retries
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install emulator --channel=0 > /dev/null; then
              exit 0
            fi

            echo "::warning::Android emulator package install failed (attempt $attempt/3); retrying."
            rm -rf "$HOME/.android/cache" "$ANDROID_HOME/.temp" || true
            sleep $((attempt * 5))
          done

          echo "::error::Unable to install the Android emulator package after 3 attempts."
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

            if [ "${{ matrix.api-level }}" -ge 30 ]; then
              set -euo pipefail

              echo "Running real app_process ReaderLB Bridge smoke test"
              adb shell mkdir -p /sdcard/Android/data/ru.libappc/files/book

              APK_PATH="$(adb shell pm path com.readerlb.app | sed -n 's/^package://p' | head -n 1 | tr -d '\r')"
              test -n "$APK_PATH"

              PROBE_OUTPUT="$(adb shell "CLASSPATH='$APK_PATH' /system/bin/app_process /system/bin com.readerlb.app.storage.bridge.ReaderLbBridgeMain --probe" | tr -d '\r')"
              printf '%s\n' "$PROBE_OUTPUT"
              printf '%s\n' "$PROBE_OUTPUT" | grep -q '^READERLB_BRIDGE_READY:'

              BRIDGE_PORT=39731
              FORWARD_PORT=39732
              TOKEN="$(printf 'ab%.0s' {1..32})"

              adb shell "CLASSPATH='$APK_PATH' nohup setsid /system/bin/app_process /system/bin --nice-name=readerlb_bridge com.readerlb.app.storage.bridge.ReaderLbBridgeMain '$BRIDGE_PORT' '$TOKEN' </dev/null >/data/local/tmp/readerlb-bridge.log 2>&1 &"

              for attempt in $(seq 1 50); do
                if adb shell "toybox nc -z 127.0.0.1 '$BRIDGE_PORT'" >/dev/null 2>&1; then
                  break
                fi
                if [ "$attempt" -eq 50 ]; then
                  adb shell cat /data/local/tmp/readerlb-bridge.log || true
                  echo "::error::ReaderLB Bridge did not start"
                  exit 1
                fi
                sleep 0.1
              done

              adb forward "tcp:$FORWARD_PORT" "tcp:$BRIDGE_PORT"

              python3 - <<'PY'
            import socket
            import struct

            HOST = "127.0.0.1"
            PORT = 39732
            MAGIC = 0x524C4231
            VERSION = 1
            TOKEN = "ab" * 32
            OP = "ping"

            def write_utf(value: str) -> bytes:
                raw = value.encode("utf-8")
                if len(raw) > 65535:
                    raise ValueError("UTF payload too long")
                return struct.pack(">H", len(raw)) + raw

            def read_exact(sock, size):
                chunks = []
                remaining = size
                while remaining:
                    chunk = sock.recv(remaining)
                    if not chunk:
                        raise RuntimeError("Bridge closed connection")
                    chunks.append(chunk)
                    remaining -= len(chunk)
                return b"".join(chunks)

            with socket.create_connection((HOST, PORT), timeout=5) as sock:
                sock.sendall(
                    struct.pack(">II", MAGIC, VERSION)
                    + write_utf(TOKEN)
                    + write_utf(OP)
                )

                ok = read_exact(sock, 1)
                assert ok == b"\x01", ok

                version = struct.unpack(">I", read_exact(sock, 4))[0]
                assert version == VERSION, version

                length = struct.unpack(">H", read_exact(sock, 2))[0]
                root = read_exact(sock, length).decode("utf-8")
                assert root.endswith("/Android/data/ru.libappc/files/book"), root

                print("ReaderLB Bridge PING OK:", root)
            PY

              adb forward --remove "tcp:$FORWARD_PORT" || true
              adb shell pkill -f readerlb_bridge || true
            fi

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ReaderLB-android-runtime-api-${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

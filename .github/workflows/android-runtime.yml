name: Android runtime tests

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 29
          - 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ReaderLB Runtime Tests,O=ReaderLB,C=AM"
          fi
          echo "READERLB_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Preinstall Android emulator with retries
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install emulator --channel=0 > /dev/null; then
              exit 0
            fi

            echo "::warning::Android emulator package install failed (attempt $attempt/3); retrying."
            rm -rf "$HOME/.android/cache" "$ANDROID_HOME/.temp" || true
            sleep $((attempt * 5))
          done

          echo "::error::Unable to install the Android emulator package after 3 attempts."
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ReaderLB-android-runtime-api-${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

name: Android build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: readerlb-debug-keystore-v1

      - name: Create stable debug signing key
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ReaderLB Debug,O=ReaderLB,C=AM"

      - name: Pin Gradle to cached debug signing key
        run: |
          echo "READERLB_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Inspect debug signing identity
        run: |
          echo "Cached debug keystore certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA256:|Valid from:"
          echo "Gradle signing configuration:"
          gradle :app:signingReport --console=plain

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReaderLB-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Compare update signing certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          echo "Current APK:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "Signer #1 certificate SHA-256 digest"

          mkdir -p "$RUNNER_TEMP/old041" "$RUNNER_TEMP/old042"
          gh run download 35521272574 --repo "$GITHUB_REPOSITORY" -n ReaderLB-debug -D "$RUNNER_TEMP/old041"
          gh run download 35522160103 --repo "$GITHUB_REPOSITORY" -n ReaderLB-debug -D "$RUNNER_TEMP/old042"

          echo "ReaderLB 0.4.1:"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/old041/app-debug.apk" | grep -E "Signer #1 certificate SHA-256 digest"
          echo "ReaderLB 0.4.2:"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/old042/app-debug.apk" | grep -E "Signer #1 certificate SHA-256 digest"

          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          APK_SHA="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2); exit}')"
          test -n "$KEY_SHA"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReaderLB-debug
          path: app/build/outputs/apk/debug/app-debug.apk

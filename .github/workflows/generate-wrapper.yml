name: Generate Gradle wrapper

on:
  push:
    branches:
      - chore/add-gradle-wrapper

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Generate official Gradle 8.9 wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

          chmod +x gradlew

          WRAPPER_SHA="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          echo "Wrapper JAR SHA-256: $WRAPPER_SHA"
          test "$WRAPPER_SHA" = "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17"

          grep -Fq "distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -Fq "distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab" gradle/wrapper/gradle-wrapper.properties

      - name: Commit generated wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --exit-code && exit 0
          git commit -m "build: add Gradle 8.9 wrapper"
          git push origin HEAD:chore/add-gradle-wrapper

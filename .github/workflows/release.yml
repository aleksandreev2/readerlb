name: ReaderLB release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tags must use exactly vMAJOR.MINOR.PATCH (for example v1.0.0)"
            exit 1
          fi

          grep -Fq "versionName = \"${VERSION}\"" app/build.gradle.kts

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Stable release tags must point to a commit already in main"
            exit 1
          fi

      - name: Restore release keystore
        env:
          READERLB_KEYSTORE_B64: ${{ secrets.READERLB_KEYSTORE_B64 }}
        run: |
          test -n "$READERLB_KEYSTORE_B64"
          echo "$READERLB_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preinstall Android 10 emulator with retries
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install emulator --channel=0 > /dev/null; then
              exit 0
            fi

            echo "::warning::Android emulator package install failed (attempt $attempt/3); retrying."
            rm -rf "$HOME/.android/cache" "$ANDROID_HOME/.temp" || true
            sleep $((attempt * 5))
          done

          echo "::error::Unable to install the Android emulator package after 3 attempts."
          exit 1

      - name: Android 10 UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Test and build release APK
        env:
          READERLB_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
          READERLB_KEY_PASSWORD: ${{ secrets.READERLB_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify release signing identity
        env:
          READERLB_KEYSTORE_PASSWORD: ${{ secrets.READERLB_KEYSTORE_PASSWORD }}
          READERLB_KEY_ALIAS: ${{ secrets.READERLB_KEY_ALIAS }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"

          APK_SHA="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          KEY_SHA="$(keytool -list -v -keystore release.keystore -storepass "$READERLB_KEYSTORE_PASSWORD" -alias "$READERLB_KEY_ALIAS" | awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"

          test -n "$APK_SHA"
          test -n "$KEY_SHA"
          test "$APK_SHA" = "$KEY_SHA"

      - name: Prepare release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "ReaderLB-${VERSION}.apk"
          sha256sum "ReaderLB-${VERSION}.apk" > "ReaderLB-${VERSION}.apk.sha256"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ReaderLB-*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading verified assets."
            gh release upload "$GITHUB_REF_NAME" \
              "ReaderLB-${VERSION}.apk" \
              "ReaderLB-${VERSION}.apk.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "ReaderLB-${VERSION}.apk" \
              "ReaderLB-${VERSION}.apk.sha256" \
              --title "ReaderLB ${VERSION}" \
              --generate-notes
          fi

      - name: Check Firebase sender configuration
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FCM sender is not configured; skipping release push."
          fi

      - name: Authenticate to Google for FCM
        if: steps.firebase.outputs.configured == 'true'
        id: google-auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Notify ReaderLB release subscribers
        if: steps.firebase.outputs.configured == 'true' && steps.google-auth.outcome == 'success'
        id: release-push
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          VERSION: ${{ github.ref_name }}
          FIREBASE_PROJECT_ID: readerlb-448c6
        run: |
          PAYLOAD="$(jq -n \
            --arg version "$VERSION" \
            '{
              message: {
                topic: "readerlb_releases",
                data: {
                  type: "release",
                  version: $version,
                  title: "Доступно обновление ReaderLB",
                  body: ("ReaderLB " + $version + " уже доступна.")
                },
                android: {
                  priority: "high"
                }
              }
            }')"

          curl --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$PAYLOAD" \
            "https://fcm.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/messages:send"

      - name: Report release push failure
        if: >-
          steps.firebase.outputs.configured == 'true' &&
          (steps.google-auth.outcome != 'success' ||
           steps.release-push.outcome == 'failure')
        run: |
          echo "::warning::GitHub Release was published, but the optional FCM notification failed."
